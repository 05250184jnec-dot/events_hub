<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub — Register</title>
  <!-- Bootstrap CSS (framework for layout + styles) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome (icons for buttons, labels, etc.) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Your custom CSS (dark mode + error styles) -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Page header with navigation -->
  <header id="top">
    <h1>JNEC Events Hub</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <div class="container py-4">
      <h2 class="mb-4">Event registration</h2>

      <!-- Registration form -->
      <form action="#" method="post" enctype="multipart/form-data" id="regForm">

        <!-- Personal details section -->
        <fieldset class="mb-4">
          <legend>Personal Details</legend>
          <div class="mb-3">
            <label for="fullname" class="form-label">Full name</label>
            <input type="text" class="form-control" id="fullname" name="fullname">
            <span id="err-fullname" class="error"></span>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="text" class="form-control" id="email" name="email">
            <span id="err-email" class="error"></span>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone">
            <span id="err-phone" class="error"></span>
          </div>
        </fieldset>

        <!-- Event choice section -->
        <fieldset class="mb-4">
          <legend>Event Choice</legend>
          <div class="mb-3">
            <label for="event_id" class="form-label">Event</label>
            <select class="form-select" id="event_id" name="event_id">
              <option value="">-- choose an event --</option>
              <option value="1">Tech Week Hackathon</option>
              <option value="2">Losar Festival Night</option>
              <option value="3">Inter-College Football</option>
            </select>
            <span id="err-event_id" class="error"></span>
            <p id="seatsHint" class="seats-hint mt-2">Choose an event to see remaining seats.</p>
          </div>

          <!-- Food preference radio buttons -->
          <p>Food preference:</p>
          <div class="form-check">
            <input class="form-check-input" type="radio" id="veg" name="food" value="veg">
            <label class="form-check-label" for="veg">Vegetarian</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" id="nonveg" name="food" value="nonveg">
            <label class="form-check-label" for="nonveg">Non-vegetarian</label>
          </div>
          <span id="err-food" class="error"></span>

          <!-- Interests checkboxes -->
          <p>Interested in:</p>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="volunteer" name="interests" value="volunteer">
            <label class="form-check-label" for="volunteer">Volunteering</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="perform" name="interests" value="perform">
            <label class="form-check-label" for="perform">Performing</label>
          </div>
          <span id="err-interests" class="error"></span>
        </fieldset>

        <!-- Date of birth -->
        <div class="mb-3">
          <label for="dob" class="form-label">Date of Birth</label>
          <input type="date" class="form-control" id="dob" name="dob">
          <span id="err-dob" class="error"></span>
        </div>

        <!-- Other details section -->
        <fieldset class="mb-4">
          <legend>Other</legend>
          <div class="mb-3">
            <label for="department" class="form-label">Department</label>
            <select class="form-select" id="department" name="department">
              <option value="">-- choose department --</option>
              <option value="it">Information Technology</option>
              <option value="civil">Civil</option>
              <option value="electrical">Electrical</option>
            </select>
            <span id="err-department" class="error"></span>
          </div>
          <div class="mb-3">
            <label for="remarks" class="form-label">Remarks</label>
            <textarea class="form-control" id="remarks" name="remarks" rows="4" maxlength="200"></textarea>
            <span id="charCount" class="text-muted">0/200</span>
          </div>
          <div class="mb-3">
            <label for="id_card" class="form-label">Student ID card (image)</label>
            <input class="form-control" type="file" id="id_card" name="id_card">
            <span id="err-id_card" class="error"></span>
          </div>
        </fieldset>

        <!-- Extra event list -->
        <div class="mb-3">
          <label for="event" class="form-label">Event (extra list)</label>
          <select class="form-select" id="event" name="event">
            <option value="hackathon">Hackathon</option>
            <option value="losar">Losar Festival Night</option>
            <option value="football">Inter-College Football</option>
            <option value="coding-quiz">Coding Quiz</option>
          </select>
        </div>

        <!-- Submit + reset buttons -->
        <button type="submit" class="btn btn-primary">Register</button>
        <button type="reset" class="btn btn-outline-secondary">Clear</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; Stay connected with all the latest events, activities, and updates happening at JNEC.</p>
  </footer>

  <!-- Bootstrap bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared JS logic for all pages -->
  <script src="js/main.js"></script>
  <!-- Validation logic specific to register.html -->
  <script src="js/validate.js"></script>
</body>
</html>
