<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub — Home</title>
  <!-- 1. Bootstrap CSS (framework) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 2. Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- 3. YOUR CSS last so you can override Bootstrap -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* Carousel image sizing: short banner instead of huge full-size photo */
    .carousel-item img {
      height: 200px;       /* try 150-250px depending on taste */
      object-fit: cover;   /* crops to fill without stretching */
      width: 100%;
    }
  </style>
</head>
<body>
  <header id="top">
    <h1>JNEC Events Hub</h1>
    <nav>
      <a href="index.html" title="Go to home page">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <!-- Carousel: first thing inside main -->
    <div id="eventCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="media/campus.jpg" class="d-block w-100" alt="JNEC campus">
        </div>
        <div class="carousel-item">
          <img src="media/jnec.jpg" class="d-block w-100" alt="Tech Week Hackathon">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#eventCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#eventCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <div class="container py-4">

      <section id="welcome" class="intro">
        <h2>Welcome</h2>
        <p>The <strong>Events Hub</strong> lists every upcoming event at 
          <em>Jigme Namgyel Engineering College</em>. 
          <span class="highlight" title="Registrations close 3 days before each event">Register early!</span>
        </p>
        <img src="media/campus.jpg" alt="JNEC campus" width="400" title="Our campus in Dewathang">
      </section>

      <section id="location">
        <h2>Find Us</h2>
        <iframe 
          src="https://www.openstreetmap.org/export/embed.html?bbox=91.44,26.85,91.48,26.88" 
          width="400" 
          height="250" 
          title="Campus map">
        </iframe>
      </section>

    </div>

  </main>

  <footer>
    <p>&copy; 2026 JNEC Events Hub</p>
  </footer>

  <!-- Bootstrap JS — MUST be last, just before </body> (carousel needs this) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
