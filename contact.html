<!DOCTYPE html> 
 <html lang="en"> 
 <head> 
   <meta charset="UTF-8"> 
   <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
   <title>JNEC Events Hub — Contact</title> 
   <link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet"> 
   <link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 
   <link rel="stylesheet" href="css/styles.css"> 
 </head> 
 <body> 
   <header id="top"> 
  <h1>JNEC Events Hub</h1> 
  <button type="button" id="darkToggle" class="btn btn-sm btn-outline-light">Dark 
mode</button> 
  <nav> 
    <a href="index.html">Home</a> 
    <a href="events.html">Events</a> 
    <a href="register.html">Register</a> 
    <a href="gallery.html">Gallery</a> 
    <a href="contact.html">Contact</a> 
  </nav> 
   </header> 
   <main> 
  <div class="container py-4"> 
    <div class="card mb-4"> 
      	<div class="card-body"> 
        <h2 class="card-title">Contact the Events Hub</h2> 
        <p>Jigme Namgyel Engineering College<br> 
           	Dewathang, Samdrup Jongkhar, Bhutan</p> 
        <p><i class="fa-solid fa-envelope"></i> 
           	<a href="mailto:events@jnec.edu.bt">events@jnec.edu.bt</a></p> 
        <p><i class="fa-solid fa-phone"></i> 
           	<a href="tel:+97517223344">+975 17 223 344</a></p> 
      	</div> 
    </div> 
    <div class="border p-2 mb-4"> 
      	<iframe 
src="https://www.openstreetmap.org/export/embed.html?bbox=91.44,26.85,91.48,26.88" 
              width="100%" height="250" title="Campus map"></iframe> 
    </div> 
 
    <h2>Enquiry</h2> 
    <form action="#" method="post" id="enquiryForm"> 
      	<div class="mb-3"> 
        <label for="enq-name" class="form-label">Name</label> 
        <input type="text" class="form-control" id="enq-name" name="name"> 
      	</div> 
      	<div class="mb-3"> 
        <label for="enq-email" class="form-label">Email</label> 
        <input type="text" class="form-control" id="enq-email" name="email"> 
      	</div> 
      	<div class="mb-3"> 
        <label for="enq-message" class="form-label">Message</label> 
        <textarea class="form-control" id="enq-message" name="message" 
rows="4"></textarea> 
      	</div> 
      	<button type="submit" class="btn btn-primary">Submit</button> 
    </form> 
  </div> 
   </main> 
   <footer> 
  <p>&copy; <span id="year"></span> JNEC Events Hub</p> 
   </footer> 
   <script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
   <script src="js/main.js"></script> 
 </body> 
 </html>
